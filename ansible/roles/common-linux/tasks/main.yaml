- name: Show the environment
  debug:
    msg:
      - "distribution: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
      - "user: {{ ansible_facts['user_id'] }}"


################
# Common tasks #
################

- name: Installing Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/robbyrussell/oh-my-zsh.git
    dest: ~/.oh-my-zsh/

- name: Installing Oh My Zsh (creating folder)
  ansible.builtin.file:
    path: ~/.oh-my-zsh/custom/plugins
    state: directory

- name: Installing Oh My Zsh (zsh-syntax-highlighting)
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: ~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting/

- name: Installing Oh My Zsh (zsh-autosuggestions)
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    dest: ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions/


#####################
# Links to dotfiles #
#####################

# List all files in the role's "files/home" folder (absolute path, independent of CWD)
- name: Find files to link
  find:
    paths: "{{ role_path }}/files/home/"
    recurse: true
    hidden: true
    excludes:
      - '*__pycache__*'
      - '*.py[co]'
  register: results

- name: Extract dotfiles paths from find
  set_fact:
    home_src: "{{ role_path }}/files/home"
    dotfiles: "{{ results.files | map(attribute='path') | list }}"

# Strip the "<role_path>/files/home/" prefix to get each path relative to the user's home.
# One shell task creates all folders and symlinks (one module execution instead of one per file),
# printing "ok" or "linked" per file so reruns are idempotent and per-file results stay visible.
- name: Creating folders and symlinks to user's home
  shell: |
    set -euo pipefail
    src_root="{{ home_src }}"
    {% for src in dotfiles %}
    src="{{ src }}"
    rel="${src#$src_root/}"
    dst="$HOME/$rel"
    mkdir -p "$(dirname "$dst")"
    if [ -L "$dst" ] && [ "$(readlink "$dst")" = "$src" ]; then
      echo "ok      $rel"
    else
      ln -sfn "$src" "$dst"
      echo "linked  $rel"
    fi
    {% endfor %}
  register: link_result
  changed_when: "link_result.stdout is search('(?m)^linked')"

- name: Show per-file link results
  debug:
    msg: "{{ link_result.stdout_lines }}"
