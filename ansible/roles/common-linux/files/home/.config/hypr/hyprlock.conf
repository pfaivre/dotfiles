general {
    ignore_empty_input = true
}

animations {
    enabled = true

    #        NAME           , X0   , Y0   , X1   , Y1
    bezier = linear         , 0    , 0    , 1    , 1
    bezier = almostLinear   , 0.5  , 0.5  , 0.75 , 1
    bezier = easeOutExpo    , 0.16 , 1    , 0.3  , 1

    #           NAME,            ONOFF , SPEED , CURVE        [,STYLE]
    animation = global,              1 , 9     , easeOutExpo
    animation = fade,                1 , 9     , easeOutExpo
    animation = fadeIn,              1 , 9     , easeOutExpo
    animation = fadeOut,             1 , 3     , easeOutExpo
    animation = inputField,          1 , 9     , easeOutExpo
    animation = inputFieldColors,    1 , 9     , easeOutExpo
    animation = inputFieldFade,      1 , 9     , easeOutExpo
    animation = inputFieldWidth,     1 , 9     , easeOutExpo
    animation = inputFieldDots,      1 , 9     , easeOutExpo
}

source = ~/.config/mydesktop/current-theme/hypr/hyprlock.conf
