background {
    monitor =
    path = $HOME/.config/mydesktop/current-theme/wallpaper/wallpaper.jpg
    blur_passes = 3
    contrast = 1
    brightness = 0.7
    noise = 0.03
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

input-field {
    monitor =
    size = 180, 32
    rounding = 10
    outline_thickness = 0
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(125, 106, 64)
    inner_color = rgb(125, 106, 64)
    font_color = rgb(125, 106, 64)
    check_color = rgb(85, 106, 53)
    fail_color = rgb(149, 28, 31)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = 
    hide_input = true
    position = 0, -45
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 1)
    shadow_boost = 0.6
}

input-field {
    monitor =
    size = 180, 32
    rounding = 10
    outline_thickness = 0
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(211, 198, 170)
    inner_color = rgb(211, 198, 170)
    font_color = rgb(45, 53, 59)
    check_color = rgb(167, 192, 128)
    fail_color = rgb(230, 126, 128)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <span foreground="##2D353B">🔒 Mot de passe</span>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

# Clock base
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgb(125, 106, 64)
    font_size = 55
    font_family = Fira Semibold
    position = 0, 297
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 1)
    shadow_boost = 0.65
}

