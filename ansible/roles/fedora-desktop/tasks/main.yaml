# This role defines tasks specific to Fedora (desktop environment)

- name: Enabling community repository lionheartp/Hyprland
  become: true
  community.general.copr:
    host: copr.fedorainfracloud.org
    state: enabled
    name: lionheartp/Hyprland

- name: Installing packages
  become: true
  ansible.builtin.dnf:
    state: present
    name:
      # - audacious
      # - eog
      # - ffmpeg # In fedora, this may conflict with another package
      - gimp
      - heif-pixbuf-loader
      - inkscape
      - libheif-freeworld
      - libreoffice-langpack-fr
      - vlc

      # Hyprland desktop
      - alacritty
      - blueman
      - fontawesome-fonts-all
      - gtk-murrine-engine
      - hypridle
      - hyprland
      - hyprlock
      - hyprpaper
      - hyprpicker
      - hyprpolkitagent
      - hyprshot
      - hyprsunset
      - libnotify
      - network-manager-applet
      - pavucontrol
      # - qt5-qtwayland
      # - qt5ct
      # - qt6-qtwayland
      # - qt6ct
      - python3-pyatspi  # used to re-open Thunar windows
      - rofi
      - SwayNotificationCenter
      - thunar
      - waybar
      - wiremix
      - wlogout
      - xdg-desktop-portal-hyprland

# SpeedCrunch calculator, launched by the SUPER+C binding (hyprland.lua).
- name: Adding Flathub remote (system-wide)
  become: true
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present

- name: Installing SpeedCrunch flatpak (system-wide)
  become: true
  community.general.flatpak:
    name: org.speedcrunch.SpeedCrunch
    remote: flathub
    method: system
    state: present
