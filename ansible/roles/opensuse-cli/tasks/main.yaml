# This role defines tasks specific to openSUSE (CLI environment)

- name: Installing packages
  become: true
  package:
    state: present
    name:
      - bc
      - btop
      - cmatrix
      - fastfetch
      - fzf
      - git
      - htop
      - ImageMagick
      - most
      - ncdu
      - neovim
      - pv
      - pwgen
      - python3-requests
      - ranger
      - sensors
      - tmux
      - toilet
      - wireguard-tools
      - xz
      - zsh

- name: Changing shell to zsh
  become: true
  user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/zsh
