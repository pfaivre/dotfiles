# This role defines tasks specific to openSUSE (desktop environment)

- name: Installing packages
  become: true
  package:
    state: present
    name:
      # - audacious
      # - eog
      # - ffmpeg
      - gimp
      - inkscape
      - vlc

      # Hyprland desktop
      - alacritty
      - blueman
      - brightnessctl
      - ddccontrol
      - file-roller
      - fontawesome-fonts
      - gnome-themes-extras
      - gtk2-engine-murrine
      - hypridle
      - hyprland
      - hyprland-guiutils
      - hyprlock
      - hyprpaper
      - hyprpicker
      - hyprpolkitagent
      - hyprshot
      - hyprsunset
      - libnotify
      - NetworkManager-applet
      - pavucontrol
      - playerctl
      - power-profiles-daemon
      # - qt5-qtwayland
      # - qt5ct
      # - qt6-qtwayland
      # - qt6ct
      - python3-pyatspi  # used to re-open Thunar windows
      - rofi
      - sensors
      - SwayNotificationCenter
      - thunar
      - thunar-archive-plugin
      - thunar-volman
      - waybar
      # - wiremix
      - wl-clipboard
      - wlogout
      - xdg-desktop-portal-hyprland

# SpeedCrunch calculator, launched by the SUPER+C binding (hyprland.lua).
- name: Adding Flathub remote (system-wide)
  become: true
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present

- name: Installing SpeedCrunch flatpak (system-wide)
  become: true
  community.general.flatpak:
    name: org.speedcrunch.SpeedCrunch
    remote: flathub
    method: system
    state: present

- name: Removing packages
  become: true
  package:
    state: absent
    name:
      - 7zip
      - unar
